<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380">
  <defs>
    <radialGradient id="bodyB" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFE033"/>
      <stop offset="100%" stop-color="#D4940A"/>
    </radialGradient>
    <linearGradient id="branchGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#5C3317"/>
      <stop offset="100%" stop-color="#3E200A"/>
    </linearGradient>
  </defs>

  <!-- Branch -->
  <path d="M 20 280 Q 150 265 280 255 Q 380 248 500 240"
        stroke="url(#branchGrad)" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M 20 280 Q 150 265 280 255 Q 380 248 500 240"
        stroke="#7a4520" stroke-width="14" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Leaf left -->
  <ellipse cx="80" cy="295" rx="28" ry="14" fill="#4CAF50" transform="rotate(20 80 295)" stroke="#2e7d32" stroke-width="2"/>
  <path d="M 68 300 Q 80 288 92 298" stroke="#2e7d32" stroke-width="1.5" fill="none"/>

  <!-- Leaf right -->
  <ellipse cx="440" cy="250" rx="32" ry="13" fill="#66BB6A" transform="rotate(-15 440 250)" stroke="#2e7d32" stroke-width="2"/>
  <path d="M 428 254 Q 440 242 452 252" stroke="#2e7d32" stroke-width="1.5" fill="none"/>

  <!-- Small leaf -->
  <ellipse cx="340" cy="258" rx="20" ry="9" fill="#4CAF50" transform="rotate(10 340 258)" stroke="#2e7d32" stroke-width="1.5"/>

  <!-- Tail coiled under branch -->
  <path d="M 255 258 Q 230 290 218 310 Q 208 328 220 338 Q 232 346 242 335 Q 250 322 240 315 Q 232 309 228 318"
        fill="none" stroke="#1a1000" stroke-width="9" stroke-linecap="round"/>
  <path d="M 255 258 Q 230 290 218 310 Q 208 328 220 338 Q 232 346 242 335 Q 250 322 240 315 Q 232 309 228 318"
        fill="none" stroke="url(#bodyB)" stroke-width="5" stroke-linecap="round"/>

  <!-- Body -->
  <ellipse cx="245" cy="215" rx="78" ry="55" fill="url(#bodyB)" stroke="#1a1000" stroke-width="7" transform="rotate(-10 245 215)"/>

  <!-- Body stripes -->
  <g stroke="#C9920A" stroke-width="2" opacity="0.3" transform="rotate(-10 245 215)">
    <path d="M 172 210 Q 245 205 318 210" fill="none"/>
    <path d="M 170 225 Q 245 220 320 225" fill="none"/>
    <path d="M 172 240 Q 245 235 318 240" fill="none"/>
  </g>

  <!-- Front legs gripping branch -->
  <path d="M 215 245 Q 210 258 215 268" stroke="#1a1000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 215 245 Q 210 258 215 268" stroke="url(#bodyB)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Front toes gripping -->
  <path d="M 215 268 L 205 278 M 215 268 L 218 280 M 215 268 L 225 275"
        stroke="#1a1000" stroke-width="4" stroke-linecap="round"/>

  <!-- Back legs gripping -->
  <path d="M 278 250 Q 275 263 280 273" stroke="#1a1000" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 278 250 Q 275 263 280 273" stroke="url(#bodyB)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Back toes gripping -->
  <path d="M 280 273 L 270 283 M 280 273 L 283 285 M 280 273 L 290 280"
        stroke="#1a1000" stroke-width="4" stroke-linecap="round"/>

  <!-- Neck -->
  <path d="M 295 195 Q 320 180 345 178 Q 355 185 350 200 Q 330 205 305 210 Z"
        fill="url(#bodyB)" stroke="#1a1000" stroke-width="6"/>

  <!-- Head -->
  <ellipse cx="368" cy="165" rx="68" ry="56" fill="url(#bodyB)" stroke="#1a1000" stroke-width="7"/>

  <!-- Head crest -->
  <path d="M 350 118 Q 358 95 372 88 Q 385 84 390 98 Q 381 104 373 112 Q 363 118 352 128 Z"
        fill="url(#bodyB)" stroke="#1a1000" stroke-width="5"/>

  <!-- Eye -->
  <circle cx="394" cy="155" r="24" fill="white" stroke="#1a1000" stroke-width="5"/>
  <circle cx="396" cy="157" r="14" fill="#0a0a0a"/>
  <circle cx="402" cy="151" r="5" fill="white"/>

  <!-- Small side eye -->
  <circle cx="345" cy="162" r="10" fill="white" stroke="#1a1000" stroke-width="3.5"/>
  <circle cx="347" cy="163" r="6" fill="#0a0a0a"/>
  <circle cx="350" cy="160" r="2" fill="white"/>

  <!-- Subtle smile -->
  <path d="M 328 180 Q 348 192 368 186" stroke="#1a1000" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Nostril -->
  <circle cx="325" cy="174" r="3" fill="#1a1000"/>
</svg>
